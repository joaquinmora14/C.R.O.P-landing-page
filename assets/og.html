  :root{
    --verde:#1A6C4A; --azul:#154D7E; --bg:#F9FBFC;
    --tinta:#10202E; --tinta-2:#51697A;
    --est-azul:#E7EFF6; --est-verde:#E7F3ED;
    --casing-halo:#0C1B2C; --casing-core:#FFFFFF;
    --terr-0:#CFDCC9; --terr-1:#B7CCB0; --terr-2:#A2BD9B;
    --terr-3:#CCC0A7; --terr-camino:#B9A483;
  }
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:var(--bg); color:var(--tinta);
    font-family:"Archivo",system-ui,sans-serif;
    font-variant-numeric:tabular-nums lining-nums;
    display:grid; grid-template-columns:1fr 520px; align-items:stretch;
  }
  .txt{padding:0 56px 0 72px;display:flex;flex-direction:column;justify-content:center;height:630px}
  .word{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:800;
        font-stretch:114%;letter-spacing:-.02em;color:var(--azul)}
  .word img{width:46px;height:auto;display:block}
  h1{font-size:52px;font-weight:800;font-stretch:114%;letter-spacing:-.032em;
     line-height:1.06;margin-top:20px;max-width:15ch}
  .lede{margin-top:20px;font-size:21px;line-height:1.45;color:var(--tinta-2);max-width:30ch}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
  .chip{font-size:15px;font-weight:600;padding:7px 14px;border-radius:100px}
  .c-azul{background:var(--est-azul);color:var(--azul)}
  .c-verde{background:var(--est-verde);color:var(--verde)}
  .fig{width:520px;height:630px;overflow:hidden}
  svg{width:100%;height:100%;display:block}
  .grilla path{fill:none;stroke:#fff;stroke-width:1;opacity:.34}
  .orbita{fill:none;stroke:var(--azul);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
  .contorno__halo{fill:none;stroke:var(--casing-halo);stroke-width:9;stroke-linejoin:round;stroke-linecap:round}
  .contorno__nucleo{fill:none;stroke:var(--casing-core);stroke-width:3.9;stroke-linejoin:round;stroke-linecap:round}
  .sat{fill:var(--azul);stroke:var(--azul)}
  .destello{fill:var(--azul);opacity:.9}
</style></head>
<body>
  <div class="txt">
    <div class="word"><img src="logo-mark.png" alt=""><span>C.R.O.P.</span></div>
    <h1>El riesgo de tu lote, medido por satélite</h1>
    <p class="lede">Cada número viene con su fuente pública y su margen.</p>
    <div class="chips">
      <span class="chip c-azul">Sentinel-2, a 10 m por píxel</span>
      <span class="chip c-verde">Fuentes públicas, todas nombradas</span>
    </div>
  </div>
  <div class="fig">
    <svg viewBox="0 0 820 880" preserveAspectRatio="xMidYMid slice">
      <defs>
        <clipPath id="marco"><rect width="820" height="880"/></clipPath>
        <g id="sat">
          <rect x="-8" y="-15" width="16" height="30" rx="5"/>
          <rect x="-38" y="-10" width="23" height="20" rx="3.5"/>
          <rect x="15" y="-10" width="23" height="20" rx="3.5"/>
          <path d="M-15 0h-1M15 0h1" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M0 -15 V-28" stroke-width="3.6" stroke-linecap="round" fill="none"/>
        </g>
      </defs>
      <g clip-path="url(#marco)">
      <!-- parcelas: dibujo plano, nunca una captura -->
      <rect width="820" height="880" fill="var(--terr-0)"/>
      <path d="M0.0 0.0 L272.0 0.0 L297.0 275.0 L0.0 296.0 Z" fill="var(--terr-1)"/>
      <path d="M272.0 0.0 L560.0 0.0 L581.4 254.9 L297.0 275.0 Z" fill="var(--terr-3)"/>
      <path d="M560.0 0.0 L820.0 0.0 L820.0 238.0 L581.4 254.9 Z" fill="var(--terr-2)"/>
      <path d="M0.0 296.0 L297.0 275.0 L324.2 574.6 L0.0 596.0 Z" fill="var(--terr-2)"/>
      <path d="M297.0 275.0 L581.4 254.9 L606.8 556.0 L324.2 574.6 Z" fill="var(--terr-0)"/>
      <path d="M581.4 254.9 L820.0 238.0 L820.0 542.0 L606.8 556.0 Z" fill="var(--terr-1)"/>
      <path d="M0.0 596.0 L324.2 574.6 L352.0 880.0 L0.0 880.0 Z" fill="var(--terr-3)"/>
      <path d="M324.2 574.6 L606.8 556.0 L634.0 880.0 L352.0 880.0 Z" fill="var(--terr-1)"/>
      <path d="M606.8 556.0 L820.0 542.0 L820.0 880.0 L634.0 880.0 Z" fill="var(--terr-2)"/>

      <!-- camino vecinal, pegado a la linde de abajo -->
      <path d="M-20 624 C 200 608, 400 580, 570 570 C 690 563, 760 558, 840 552"
            fill="none" stroke="var(--terr-camino)" stroke-width="18"/>

      <!-- grilla de 10 m: cada celda es un píxel de Sentinel-2 -->
      <g class="grilla">
        <path d="M28 0V880M56 0V880M84 0V880M112 0V880M140 0V880M168 0V880M196 0V880M224 0V880M252 0V880M280 0V880M308 0V880M336 0V880M364 0V880M392 0V880M420 0V880M448 0V880M476 0V880M504 0V880M532 0V880M560 0V880M588 0V880M616 0V880M644 0V880M672 0V880M700 0V880M728 0V880M756 0V880M784 0V880M812 0V880"/>
        <path d="M0 28H820M0 56H820M0 84H820M0 112H820M0 140H820M0 168H820M0 196H820M0 224H820M0 252H820M0 280H820M0 308H820M0 336H820M0 364H820M0 392H820M0 420H820M0 448H820M0 476H820M0 504H820M0 532H820M0 560H820M0 588H820M0 616H820M0 644H820M0 672H820M0 700H820M0 728H820M0 756H820M0 784H820M0 812H820M0 840H820M0 868H820"/>
      </g>

      <!-- la órbita del isotipo. Se dibuja antes que el lote, así pasa
           por detrás de él, igual que en el logo. -->
      <path class="orbita" pathLength="100" d="M-8.2 657.4 L-15.6 646.6 L-22.3 635.4 L-28.2 623.8 L-33.2 611.9 L-37.5 599.6 L-40.9 586.9 L-43.5 574.0 L-45.3 560.8 L-46.2 547.4 L-46.3 533.7 L-45.6 519.9 L-44.0 505.9 L-41.6 491.7 L-38.4 477.4 L-34.3 463.1 L-29.4 448.7 L-23.8 434.2 L-17.3 419.7 L-10.0 405.3 L-2.0 390.9 L6.7 376.5 L16.3 362.3 L26.5 348.2 L37.4 334.3 L49.0 320.5 L61.3 306.9 L74.2 293.6 L87.7 280.5 L101.8 267.7 L116.5 255.2 L131.7 243.1 L147.4 231.3 L163.5 219.8 L180.1 208.8 L197.2 198.1 L214.6 187.9 L232.3 178.2 L250.4 168.9 L268.7 160.1 L287.3 151.9 L306.1 144.1 L325.1 136.9 L344.2 130.2 L363.4 124.1 L382.7 118.6 L402.0 113.6 L421.4 109.3 L440.6 105.5 L459.8 102.4 L478.9 99.8 L497.9 97.9 L516.6 96.6 L535.2 96.0 L553.5 95.9 L571.5 96.5 L589.2 97.7 L606.5 99.5 L623.4 102.0 L639.9 105.1 L656.0 108.7 L671.6 113.0 L686.7 117.9 L701.2 123.3 L715.2 129.4 L728.6 136.0 L741.3 143.1 L753.5 150.8 L764.9 159.0 L775.7 167.7 L785.8 177.0 L795.2 186.6 L803.8 196.8 L811.6 207.4 L818.7 218.3 L825.0 229.7 L830.5 241.5 L835.2 253.6 L839.1 266.1 L842.2 278.8"/>

      <!-- el lote, con el contorno de doble línea (casing) -->
      <g class="contorno">
        <path class="contorno__halo" pathLength="100" vector-effect="non-scaling-stroke"
          d="M182 494 L247 386 L378 348 L498 368 L581 427 L601 509 L533 544 L572 605 L486 653 L363 676 L277 660 Q214 640 201 592 L167 544 Z"/>
        <path class="contorno__nucleo" pathLength="100" vector-effect="non-scaling-stroke"
          d="M182 494 L247 386 L378 348 L498 368 L581 427 L601 509 L533 544 L572 605 L486 653 L363 676 L277 660 Q214 640 201 592 L167 544 Z"/>
      </g>

      <!-- el satélite apoyado sobre la órbita, y el destello del isotipo -->
      <g class="sat" transform="translate(650 107) rotate(13.3)">
        <use href="#sat"/>
      </g>
      <path class="destello"
            d="M566 150 c4 21 8 25 29 29 c-21 4 -25 8 -29 29 c-4 -21 -8 -25 -29 -29 c21 -4 25 -8 29 -29 Z"/>

      </g>
    </svg>
  </div>
</body></html>
